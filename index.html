<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Projects - My Journey From Code to Creation</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/neumorphic.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/interactions.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <button class="nav-btn" data-page="home">
                <span class="icon">⌂</span>
                <span class="label">HOME</span>
            </button>
            <button class="nav-btn" data-page="contents">
                <span class="icon">≡</span>
                <span class="label">CONTENTS</span>
            </button>
            <button class="nav-btn" data-page="projects">
                <span class="icon">◆</span>
                <span class="label">PROJECTS</span>
            </button>
            <button class="nav-btn" data-page="progress">
                <span class="icon">◐</span>
                <span class="label">PROGRESS</span>
            </button>
            <button class="nav-btn" data-page="search">
                <span class="icon">⌕</span>
                <span class="label">SEARCH</span>
            </button>
            <button class="nav-btn" id="theme-toggle">
                <span class="icon">◑</span>
                <span class="label">THEME</span>
            </button>
        </div>
    </nav>

    <!-- Book Container -->
    <div class="book-wrapper">
        <div class="page-container">
            <!-- Cover Page -->
            <div class="page active" id="page-home">
                <div class="book-cover">
                    <div class="cover-background"></div>
                    
                    <div class="cover-content">
                        <div class="cover-decorative top-left">
                            <span>&lt;</span>
                        </div>
                        
                        <div class="cover-decorative top-right">
                            <span>&gt;</span>
                        </div>
                        
                        <h1 class="cover-title">100<br>PROJECTS</h1>
                        
                        <div class="cover-subtitle">MY JOURNEY FROM CODE TO CREATION</div>
                        
                        <div class="cover-stats">
                            <div class="stat-item">
                                <div class="stat-value">100</div>
                                <div class="stat-label">TOTAL</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" id="completed-count">0</div>
                                <div class="stat-label">COMPLETED</div>
                            </div>
                        </div>

                        <div class="cover-decorative bottom-left">
                            <span>{}</span>
                        </div>
                        
                        <div class="cover-decorative bottom-right">
                            <span>;</span>
                        </div>
                    </div>

                    <div class="progress-indicator">
                        <div class="progress-track">
                            <div class="progress-fill" id="cover-progress"></div>
                        </div>
                        <div class="progress-text" id="progress-text">0 / 100 PROJECTS</div>
                    </div>
                </div>

                <div class="page-controls">
                    <button class="control-btn prev-btn" disabled>
                        <span>← PREVIOUS</span>
                    </button>
                    <button class="control-btn contents-btn">
                        <span>TABLE OF CONTENTS</span>
                    </button>
                    <button class="control-btn next-btn">
                        <span>NEXT →</span>
                    </button>
                </div>
            </div>

            <!-- Projects List Page -->
            <div class="page" id="page-projects">
                <div class="page-header">
                    <h2>ALL PROJECTS</h2>
                    <div class="page-description">Your complete journey through 100 coding projects</div>
                </div>

                <div class="projects-grid" id="projects-grid">
                    <!-- Projects will be dynamically loaded here -->
                </div>

                <div class="page-controls">
                    <button class="control-btn prev-btn">
                        <span>← PREVIOUS</span>
                    </button>
                    <button class="control-btn contents-btn">
                        <span>TABLE OF CONTENTS</span>
                    </button>
                    <button class="control-btn next-btn">
                        <span>NEXT →</span>
                    </button>
                </div>
            </div>

            <!-- Progress Page -->
            <div class="page" id="page-progress">
                <div class="page-header">
                    <h2>PROGRESS</h2>
                    <div class="page-description">Track your coding journey</div>
                </div>

                <div class="progress-container">
                    <div class="large-progress-card">
                        <div class="progress-circle">
                            <svg viewBox="0 0 200 200">
                                <circle cx="100" cy="100" r="90" class="progress-bg"></circle>
                                <circle cx="100" cy="100" r="90" class="progress-circle-fill" id="circle-progress"></circle>
                            </svg>
                            <div class="progress-center">
                                <div class="progress-number" id="progress-number">0</div>
                                <div class="progress-label">%</div>
                            </div>
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">100</div>
                            <div class="stat-label">TOTAL PROJECTS</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="stat-completed">0</div>
                            <div class="stat-label">COMPLETED</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="stat-remaining">100</div>
                            <div class="stat-label">REMAINING</div>
                        </div>
                    </div>
                </div>

                <div class="page-controls">
                    <button class="control-btn prev-btn">
                        <span>← PREVIOUS</span>
                    </button>
                    <button class="control-btn contents-btn">
                        <span>TABLE OF CONTENTS</span>
                    </button>
                    <button class="control-btn next-btn">
                        <span>NEXT →</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Project Detail Modal -->
    <div class="modal" id="project-modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close">×</button>
            <div class="modal-body" id="modal-body">
                <!-- Project details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/interactions.js"></script>
</body>
</html>
